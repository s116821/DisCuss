name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    env:
      OPENSPEC_TELEMETRY: "0"
      DISCORD_LIVE_TESTS: "0"
      OPENSPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Dependencies
        run: |
          uv sync --locked --all-groups --extra runtime
          npm ci
          sudo apt-get update && sudo apt-get install -y libopus0
      - name: Code checks
        run: |
          uv run --extra runtime ruff check .
          uv run --extra runtime ruff format --check .
          uv run --extra runtime ty check
          uv run --extra runtime pytest
          npm run test:release
          npm run spec:validate
          uv run --extra runtime python scripts/check_openspec.py
      - name: Pinned synthetic speech model
        run: uv run --extra runtime discuss model-setup --state-dir "${{ runner.temp }}/speech-state"
      - name: CPU recognition and bounded attributed load
        run: uv run --extra runtime python -m scripts.evaluate_speech --state-dir "${{ runner.temp }}/speech-state" --output speech-metrics/linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: speech-metrics
          path: speech-metrics/*.json
      - name: Read-only semantic-release candidate preview
        id: plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/plan_release.mjs

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      DISCORD_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Linux native codec
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: Build package and platform archive once
        id: package
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ needs.quality.outputs.tag }}
        run: |
          uv sync --locked --no-dev --extra runtime
          uv run --no-dev --extra runtime python -m scripts.build_platform --platform '${{ matrix.platform }}' --candidate "$env:CANDIDATE_TAG"
      - name: Download previously published upgrade inputs
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-dev --extra runtime python -m scripts.previous_releases --platform '${{ matrix.platform }}'
      - name: Exact saved archives install, upgrade, rollback and removal
        shell: pwsh
        run: uv run --no-dev --extra runtime python -m scripts.smoke_native previous/0 --tag '${{ steps.previous.outputs.first }}' --upgrade previous/1 --upgrade-tag '${{ steps.previous.outputs.second }}' --second-upgrade dist --second-upgrade-tag '${{ steps.package.outputs.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: dist/

  release:
    needs: [quality, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      EXPECTED_TAG: ${{ needs.quality.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.quality.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Publication tools
        run: |
          uv sync --locked --no-dev --extra runtime
          npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: saved-builds/
      - name: Verify source, version and checksums; collect saved files
        shell: pwsh
        run: uv run --no-dev --extra runtime python -m scripts.collect_release saved-builds --tag "$env:EXPECTED_TAG" --commit "$env:EXPECTED_COMMIT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Final semantic-release resolution and publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
