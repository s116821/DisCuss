name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENSPEC_TELEMETRY: "0"
      DISCORD_LIVE_TESTS: "0"
      OPENSPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Sync
        run: uv sync --locked --all-groups --extra runtime
      - name: Native Opus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: npm ci
      - name: Ruff
        run: uv run --extra runtime ruff check .
      - name: Ruff format
        run: uv run --extra runtime ruff format --check .
      - name: ty
        run: uv run --extra runtime ty check
      - name: pytest
        run: uv run --extra runtime pytest
      - name: Actual semantic-release analyzer
        run: npm run test:release
      - name: OpenSpec canonical validation
        run: npm run spec:validate
      - name: OpenSpec merge readiness
        run: uv run --extra runtime python scripts/check_openspec.py
      - name: Build
        run: uv build

  native-smoke:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISCORD_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Native Opus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: uv sync --locked --all-groups --extra runtime
      - name: Build tagged disposable fixture archives
        run: |
          uv run --extra runtime python -m scripts.prepare_smoke_bundle smoke-assets
          uv run --extra runtime python -m scripts.prepare_smoke_bundle upgrade-assets --tag v1.2.4
          uv run --extra runtime python -m scripts.prepare_smoke_bundle second-upgrade-assets --tag v1.2.5
      - name: Exact extracted asset install, rerun, upgrade, rollback and removal
        run: uv run --extra runtime python -m scripts.smoke_native smoke-assets --upgrade upgrade-assets --second-upgrade second-upgrade-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-fixtures-${{ runner.os }}
          path: smoke-assets/SHA256SUMS

  synthetic-speech:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISCORD_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-groups --extra runtime
      - name: Explicit pinned synthetic-only model setup
        shell: pwsh
        run: uv run --extra runtime discuss model-setup --state-dir "${{ runner.temp }}/speech-state"
      - name: CPU recognition and bounded attributed load
        shell: pwsh
        run: uv run --extra runtime python -m scripts.evaluate_speech --state-dir "${{ runner.temp }}/speech-state" --output "speech-metrics/${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: speech-metrics-${{ runner.os }}
          path: speech-metrics/*.json

  release:
    needs: [quality, native-smoke, synthetic-speech]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_READY == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
