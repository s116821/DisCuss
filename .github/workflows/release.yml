name: release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Build tag-derived packages and complete archives
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          uv sync --locked --all-groups
          uv build
          uv export --quiet --locked --extra runtime --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
          uv run python scripts/create_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/

  smoke:
    needs: [release, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Linux native codec
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: uv sync --locked --all-groups
      - name: Test exact extracted release assets before upload
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: pwsh
        run: uv run python -m scripts.smoke_native dist --tag $env:RELEASE_TAG

  publish:
    needs: [release, build, smoke]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Upload verified assets in the same workflow as tag creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
