[project]
name = "discuss"
description = "Self-hosted Discord voice profanity competition."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
license = "GPL-3.0-only"
dependencies = [
    "pydantic>=2.10",
    "tzdata>=2025.1",
]

[project.scripts]
discuss = "discuss.cli:main"

[project.optional-dependencies]
runtime = [
    "discord-voice-reception",
    "faster-whisper==1.2.1",
    "filelock>=3.20",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1",
    "packaging>=24",
    "pyyaml>=6.0",
    "psutil>=7",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/discuss"]

[tool.hatch.build.targets.wheel.sources]
"src/discuss" = "discuss"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ty.src]
include = ["src"]

[tool.uv.sources]
discord-voice-reception = { url = "https://github.com/s116821/DiscordVoiceReception/archive/b68549dd0b45435d7e7e12de5fd6e0982d107e86.tar.gz" }
